[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drowning-project"
version = "0.1.0"
description = "Local tooling for audited drowning-detection datasets and workflows"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "Pillow>=10", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
ml = ["torch==2.14.1", "torchvision==0.29.1"]
dev = ["pytest>=8"]
api = [
  "fastapi==0.158.1",
  "uvicorn[standard]>=0.35,<1.0",
  "SQLAlchemy==2.0.55",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "httpx>=0.28,<1.0",
  "python-multipart>=0.0.20,<1.0",
]
drive = [
  "google-api-python-client>=2.130,<3.0",
  "google-auth-oauthlib>=1.2,<2.0",
  "google-auth-httplib2>=0.2,<1.0",
]
vision = ["opencv-python-headless>=4.9,<5.0"]
detector = ["ultralytics>=8.3,<9.0", "lap>=0.5.12,<0.6"]
kaggle = ["kaggle>=2.2.5,<3.0"]

[project.scripts]
drownctl = "drowning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
